onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
status_indicators = "symbols"

# Agent サイドバーを attention 順 (blocked → done → …) に並べる。
# 既定の "spaces" は workspace ごとのグループ表示で、待たせているエージェントが
# 一覧のどこに居るか毎回探すことになる。next_agent と組み合わせて
# 「1 打鍵目が要対応エージェント」になるようにするための前提設定
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true

[keys]
# prefix はデフォルトの ctrl+b から ctrl+q に変更
prefix = "ctrl+q"

# スクロール (copy mode) はデフォルト未割り当てなので tmux 風に割り当てる
copy_mode = "prefix+["

# pane 移動は矢印キーでも行えるようにする（tmux の prefix+矢印と同じ操作感）
# 指定した値でデフォルトが置き換わるため、配列に prefix+h/j/k/l も明示して残す
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# workspace 操作を「tab の同じ操作 + shift」に揃える。herdr の既定は tab が
# prefix+c/n/p (新規/次/前) なのに workspace の新規が prefix+shift+n で、
# shift 層で n の意味が new と next に食い違っていた。ここを tab 側に合わせる。
# switch/next/previous_workspace はいずれも既定未割り当てなので新規追加。
# なお prefix なしの shift+1..9 は herdr が「入力を奪う」として拒否するため prefix 必須。
switch_workspace = "prefix+shift+1..9"   # prefix+1..9 (switch_tab) の shift 版
previous_workspace = "prefix+shift+p"    # prefix+p (previous_tab) の shift 版
next_workspace = "prefix+shift+n"        # prefix+n (next_tab) の shift 版
new_workspace = "prefix+shift+c"         # prefix+c (new_tab) の shift 版。既定の prefix+shift+n から移動

# 作業が終わった / 質問してきたエージェントへ飛ぶための移動キー。
# next/previous_agent は Agent サイドバーの表示順で移動するので、
# ui.agent_panel_sort = "priority" と併せて attention 順の巡回になる。
# focus は done (= idle だが未確認) を seen に落とすため、押し続けるだけで
# 未確認の完了を消化できる。いずれも既定未割り当てなので新規追加。
# 「次/前は n/p、番号は 1..9、階層は 無印(tab) → shift(workspace) → alt(agent)」
# という規則に合わせるため、agent は alt 層に統一する
previous_agent = "prefix+alt+p"   # prefix+p (previous_tab) の alt 版
next_agent = "prefix+alt+n"       # prefix+n (next_tab) の alt 版
focus_agent = "prefix+alt+1..9"   # prefix+1..9 (switch_tab) の alt 版

# 既定の prefix+shift+p は previous_workspace に、退避先だった prefix+alt+p は
# previous_agent に明け渡した。t=tab / w=workspace / p=pane という rename の
# 頭文字ルールは shift/alt 層のどちらでも維持できないので、tmux の
# rename (prefix+,) に倣って修飾キーなしの層へ逃がす。
# rename_pane 自体は滅多に使わないため、頭文字ルールより
# 「shift=workspace / alt=agent を例外なく保つ」ことを優先した
rename_pane = "prefix+comma"

# フォーカス中の Claude Code セッションを分岐して隣の pane で開く
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "$HOME/.config/herdr/scripts/fork-claude-session.sh"
description = "fork focused claude session"

# エージェントが変更したツリーを lazygit で確認する
# popup はタブレイアウトを変えず、lazygit が多用する Escape も転送される
# herdr サーバはデーモン化時に PATH=/usr/bin:/bin:/usr/sbin:/sbin まで削られており、
# カスタムコマンドは login shell を経由しないため Homebrew の PATH を明示する
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH exec lazygit"
description = "lazygit"
width = "80%"
height = "80%"

# エージェントの差分をレビューし、行コメントをエージェントの入力欄へ送る
# key は <plugin_id>.<action_id>。README は cmd+r を勧めるが iTerm2 が Cmd+R を
# 消費するため prefix 経由にする
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr toggle"

# nvim をサイドバーで開き、エージェントの出力からファイルを拾う
# prefix+e / prefix+o は既定の edit_scrollback / open_notification_target と衝突する。
# config check は keys.command と既定の衝突を報告せず黙って一方が死ぬため alt 層へ退避。
# 特に open_notification_target は toast の発生元 pane へ飛ぶ操作で、
# ui.toast.delivery = "herdr" にしている以上手放したくない
[[keys.command]]
key = "prefix+alt+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
