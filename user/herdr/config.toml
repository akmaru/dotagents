onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true

[keys]
# prefix はデフォルトの ctrl+b から ctrl+q に変更
prefix = "ctrl+q"

# スクロール (copy mode) はデフォルト未割り当てなので tmux 風に割り当てる
copy_mode = "prefix+["

# pane 移動は矢印キーでも行えるようにする（tmux の prefix+矢印と同じ操作感）
# 指定した値でデフォルトが置き換わるため、配列に prefix+h/j/k/l も明示して残す
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# workspace 操作を「tab の同じ操作 + shift」に揃える。herdr の既定は tab が
# prefix+c/n/p (新規/次/前) なのに workspace の新規が prefix+shift+n で、
# shift 層で n の意味が new と next に食い違っていた。ここを tab 側に合わせる。
# switch/next/previous_workspace はいずれも既定未割り当てなので新規追加。
# なお prefix なしの shift+1..9 は herdr が「入力を奪う」として拒否するため prefix 必須。
switch_workspace = "prefix+shift+1..9"   # prefix+1..9 (switch_tab) の shift 版
previous_workspace = "prefix+shift+p"    # prefix+p (previous_tab) の shift 版
next_workspace = "prefix+shift+n"        # prefix+n (next_tab) の shift 版
new_workspace = "prefix+shift+c"         # prefix+c (new_tab) の shift 版。既定の prefix+shift+n から移動

# prefix+shift+p を next/previous_workspace に明け渡した分の退避先。
# t=tab / w=workspace / p=pane という rename の頭文字ルールは alt 側で保つ
rename_pane = "prefix+alt+p"

# フォーカス中の Claude Code セッションを分岐して隣の pane で開く
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "$HOME/.config/herdr/scripts/fork-claude-session.sh"
description = "fork focused claude session"

# エージェントが変更したツリーを lazygit で確認する
# popup はタブレイアウトを変えず、lazygit が多用する Escape も転送される
# herdr サーバはデーモン化時に PATH=/usr/bin:/bin:/usr/sbin:/sbin まで削られており、
# カスタムコマンドは login shell を経由しないため Homebrew の PATH を明示する
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH exec lazygit"
description = "lazygit"
width = "80%"
height = "80%"

# エージェントの差分をレビューし、行コメントをエージェントの入力欄へ送る
# key は <plugin_id>.<action_id>。README は cmd+r を勧めるが iTerm2 が Cmd+R を
# 消費するため prefix 経由にする
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr toggle"

# nvim をサイドバーで開き、エージェントの出力からファイルを拾う
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
