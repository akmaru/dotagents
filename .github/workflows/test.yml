name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # uv sync provides the apm CLI (apm-cli dev dependency), so the marketplace
      # e2e test (test_e2e_marketplace.py) runs here too.
      - name: Sync dev tools
        run: uv sync

      # Claude Code CLI lets the e2e test check that an installed skill is listed as a slash command
      # (the system/init line of a headless run). No API key is set: the init line comes before any API
      # call, and the call that follows fails without cost.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The ontology package verifies ONTOLOGY.md with Alloy (Java is preinstalled on ubuntu-latest). Fetch the jar
      # once so tests/test_ontology.py runs its Alloy tests instead of skipping them.
      - name: Fetch Alloy for ontology tests
        run: python3 packages/ontology/.apm/skills/ontology/scripts/ontology.py setup-alloy

      # The e2e test for init-project installs from GitHub at the commit under test (the same path as a real
      # `apm marketplace add akmaru/dotagents`), so a relative dependency is checked against a real clone.
      # The token lifts the unauthenticated GitHub API rate limit that apm hits.
      - name: Run tests
        env:
          DOTAGENTS_E2E_REMOTE: ${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run pytest tests/ -v
