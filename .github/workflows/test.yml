name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # uv sync provides the apm CLI (apm-cli dev dependency), so the marketplace
      # e2e test (test_e2e_marketplace.py) runs here too.
      - name: Sync dev tools
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
