name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Check marketplace.json is up to date
        run: |
          python3 scripts/generate_marketplace.py
          git diff --exit-code marketplace.json || \
            (echo "marketplace.json is out of sync with apm.yml. Run: uv run --with pyyaml python3 scripts/generate_marketplace.py" && exit 1)

      - name: Run tests
        run: pytest tests/ -v
