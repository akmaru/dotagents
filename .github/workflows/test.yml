name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # uv sync provides the apm CLI (apm-cli dev dependency), so the marketplace
      # e2e test (test_e2e_marketplace.py) runs here too.
      - name: Sync dev tools
        run: uv sync

      # Claude Code CLI lets the e2e test check that an installed skill is listed as a slash command
      # (the system/init line of a headless run). No API key is set: the init line comes before any API
      # call, and the call that follows fails without cost.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: uv run pytest tests/ -v
