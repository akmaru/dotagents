# Hindsight サーバー一式（TLS 終端 / API / Postgres）。
# 秘密は同ディレクトリの .env（deploy.sh が SSM Parameter Store から生成、gitignore）から読む。
# 非秘密の設定値は ../config.sh と同じ内容を environment: に書く（差分が出たら両方直す）。

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # ACME HTTP-01 と https へのリダイレクト
      - "443:443"
    environment:
      HINDSIGHT_DOMAIN: ${HINDSIGHT_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hindsight-api

  hindsight-api:
    image: ghcr.io/vectorize-io/hindsight-api:${HINDSIGHT_VERSION:-0.9.2}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/hindsight
      # 認証: Authorization: Bearer <HINDSIGHT_API_TENANT_API_KEY>。MCP endpoint にも効く
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?set in .env}
      # 以下 ../config.sh と同じ
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in .env}
      HINDSIGHT_API_REFLECT_LLM_MODEL: claude-sonnet-5
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: Japanese
    volumes:
      # 埋め込みモデル (~130MB) のキャッシュ。再起動時の再ダウンロードを避ける
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: hindsight
    volumes:
      # EBS データボリューム上。スナップショットはこのパスを含むボリューム単位で取る
      - ${HINDSIGHT_DATA_DIR:-/data/hindsight}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  hf_cache:
