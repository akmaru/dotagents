# Hindsight サーバー一式（TLS 終端 / API / Postgres）。
# 秘密は同ディレクトリの .env（deploy.sh が SSM Parameter Store から生成、gitignore）から読む。
# 非秘密の設定値は environment: に直接書く（理由は各行のコメントと ../README.md「既知の罠」）。

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"    # ACME HTTP-01 と https へのリダイレクト
      - "443:443"
    environment:
      HINDSIGHT_DOMAIN: ${HINDSIGHT_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hindsight-api

  hindsight-api:
    image: ghcr.io/vectorize-io/hindsight-api:${HINDSIGHT_VERSION:-0.9.2}
    restart: unless-stopped
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/hindsight
      # 認証: Authorization: Bearer <HINDSIGHT_API_TENANT_API_KEY>。MCP endpoint にも効く
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?set in .env}
      # 未設定だと openai にフォールバックし、Anthropic のキーを OpenAI へ送って 401 になる
      HINDSIGHT_API_LLM_PROVIDER: anthropic
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?set in .env}
      # reflect は上位モデル。既定の haiku は記憶にない情報を捏造し directive も無視する
      HINDSIGHT_API_REFLECT_LLM_MODEL: claude-sonnet-5
      # 日本語で投入しても fact が英語や中国語に翻訳されて保存されるのを防ぐ
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: Japanese
      # OUTPUT_LANGUAGE を設定すると consolidation の識別子保護ルールが外れる (README の既知の罠)。
      # haiku は残った翻訳指示に引きずられて識別子を日本語化するため、observation 生成も上位モデルにする
      HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: claude-sonnet-5
    volumes:
      # 埋め込みモデル (~130MB) のキャッシュ。再起動時の再ダウンロードを避ける
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8888/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # 識別子の破損を定期検出する (../scanner/README.md)。LLM を使わない照合だけで、
  # 結果は ${HINDSIGHT_DATA_DIR}/scanner/report.json に書く。API は compose
  # ネットワーク内で叩くので Caddy を経由しない。
  # イメージをビルドせず、素の python にスクリプトを読ませる。サーバーの buildx は
  # 0.12.1 で Compose v5.5.1 が要求する 0.17.0 に満たず `compose build` が通らない。
  # 検出は標準ライブラリだけで動くので、ビルドする理由がそもそも無い。
  scanner:
    image: python:3.12-slim
    restart: unless-stopped
    user: "65534:65534"
    command: ["python", "-u", "/app/scanner.py"]
    environment:
      HINDSIGHT_API_URL: http://hindsight-api:8888
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_TENANT_API_KEY:?set in .env}
      SCANNER_STATE_DIR: /state
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../scanner/scanner.py:/app/scanner.py:ro
      - ${HINDSIGHT_DATA_DIR:-/data/hindsight}/scanner:/state
    depends_on:
      hindsight-api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: hindsight
    volumes:
      # EBS データボリューム上。スナップショットはこのパスを含むボリューム単位で取る
      - ${HINDSIGHT_DATA_DIR:-/data/hindsight}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  hf_cache:
