[project]
name = "beads-sync"
version = "0.1.0"
description = "Sync beads issues to GitHub or GitLab Issues"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
beads-sync = "beads_sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beads_sync.py"]
